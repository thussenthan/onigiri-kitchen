name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: pip install "pytest==8.3.*" pyflakes
      - name: Python mistakes (undefined names and the like)
        run: |
          out=$(python -m pyflakes onigiri_kitchen tests tests_main dev | grep -v "imported but unused" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Python tests (the parts that don't need Anki)
        run: python -m pytest -q tests
      - name: Python tests (main.py, against stand-ins for Anki)
        run: python -m pytest -q tests_main
      - name: Scripts parse and lint
        run: |
          for f in onigiri_kitchen/web/*.js; do node --check "$f"; done
          npx --yes eslint@9.14.0 --no-warn-ignored onigiri_kitchen/web tests/*.js
      - name: Stats pages render
        run: node tests/stats_smoke.js
      - name: The kitchen page runs in a real browser
        run: |
          python dev/make_preview.py
          npm i --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tests/kitchen_smoke.js
      - name: Release is consistent
        run: python dev/release_check.py
      - name: Build the packages
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.ankiaddon dist/*.zip

  anki:
    # The add-on reaches into a few parts of Anki: check they're still there, in the oldest
    # Anki it supports and the newest.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aqt: ['aqt[qt6]==23.10.1', 'aqt[qt6]']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Anki
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
          pip install "${{ matrix.aqt }}"
      - name: Anki's side is as expected
        run: QT_QPA_PLATFORM=offscreen python tests/anki_compat.py
