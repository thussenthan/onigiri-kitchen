name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: pip install pytest pyflakes
      - name: Python mistakes (undefined names and the like)
        run: |
          out=$(python -m pyflakes onigiri_kitchen | grep -v "imported but unused" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Python tests
        run: python -m pytest -q tests
      - name: Scripts parse
        run: for f in onigiri_kitchen/web/*.js; do node --check "$f"; done
      - name: Stats pages render
        run: node tests/stats_smoke.js
      - name: Build the packages
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.ankiaddon dist/*.zip
