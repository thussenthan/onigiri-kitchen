<!doctype html><html><head><meta charset="utf-8"><title>Widget preview</title>
<style>
body { margin:0; padding:24px; font-family:-apple-system,system-ui; background:var(--bg); color:var(--fg);
  --bg:#f3f3f3; --fg:#212121; --fg-subtle:#757575; --border:#e0e0e0; --canvas-inset:#ffffff; --accent-color:#007aff; }
body.nightMode { --bg:#2c2c2c; --fg:#e0e0e0; --fg-subtle:#9e9e9e; --border:#424242; --canvas-inset:#2c2c2c; --accent-color:#0a84ff; }
.unified-grid { display:grid; gap:15px; grid-auto-rows:minmax(110px,auto); grid-template-columns:repeat(4,1fr); }
.external-widget-container, .onigiri-widget-container { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.fake { background:var(--canvas-inset); border-radius:15px; border:1px solid var(--border); display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:0 18px; box-sizing:border-box; color:var(--fg); font-size:13px; } .fake .lbl { color:var(--fg-subtle); font-size:12px; font-weight:600; } .fake b { font-size:22px; font-weight:800; }
h3 { font-size:13px; color:var(--fg-subtle); margin:18px 0 8px; }
.heat { position:relative; justify-content:flex-start; padding:16px 18px; } .cells { position:absolute; inset:46px 18px 18px; display:grid; grid-template-columns:repeat(14,1fr); grid-auto-rows:min-content; align-content:start; gap:3px; overflow:hidden; }
.cells i { aspect-ratio:1; border-radius:3px; background:var(--accent-color); }
.plainwrap { background:#fff; padding:14px; border-radius:8px; text-align:center; color:#333; }
</style>
<script>window.pycmd=(m)=>{document.title=m};</script>
<link rel="stylesheet" href="../onigiri_kitchen/web/widget.css">
<script src="../onigiri_kitchen/web/widget.js"></script></head>

<script>{ // a stand-in for Onigiri's heatmap: 12 weeks of made-up study days
  let x = 7; const heat = document.getElementById('heat');
  for (let i = 0; i < 168; i++) { x = (x * 48271) % 2147483647; const v = x % 5;
    const c = document.createElement('i'); c.style.opacity = v ? 0.2 + v * 0.2 : 0.08; heat.appendChild(c); } }</script>
