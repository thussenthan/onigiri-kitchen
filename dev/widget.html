<!doctype html><html><head><meta charset="utf-8"><title>Widget preview</title>
<style>
body { margin:0; padding:24px; font-family:-apple-system,system-ui; background:var(--bg); color:var(--fg);
  --bg:#e6e9ef; --fg:#4c4f69; --fg-subtle:#6c6f85; --border:#bcc0cc; --canvas-inset:#dce0e8; --accent-color:#89b4fa; }
body.nightMode { --bg:#1e1e2e; --fg:#cdd6f4; --fg-subtle:#a6adc8; --border:#45475a; --canvas-inset:#313244; }
.unified-grid { display:grid; gap:15px; grid-auto-rows:minmax(110px,auto); grid-template-columns:repeat(4,1fr); }
.external-widget-container, .onigiri-widget-container { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.fake { background:var(--canvas-inset); border-radius:15px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--fg-subtle); font-size:13px; }
h3 { font-size:13px; color:var(--fg-subtle); margin:18px 0 8px; }
.plainwrap { background:#fff; padding:14px; border-radius:8px; text-align:center; color:#333; }
</style>
<script>window.pycmd=(m)=>{document.title=m};</script>
<link rel="stylesheet" href="../onigiri_kitchen/web/widget.css">
<script src="../onigiri_kitchen/web/widget.js"></script></head>
<body><script>if(location.search.includes('night'))document.body.className='nightMode'</script>
<h3>Onigiri home grid</h3>
<div class="unified-grid">
  <div class="onigiri-widget-container fake" style="grid-area:1/1/span 1/span 1">Studied</div>
  <div class="external-widget-container" style="grid-area:1/2/span 1/span 2"><div class="okw" role="button" tabindex="0"><script type="application/json" class="okw-data">{"guests": 7, "nextIn": 3, "reviews": 142, "mon": 186, "pet": {"name": "Tama", "tummy": 70, "love": 85, "energy": 70, "stage": 1}, "theme": "#AFC3D6", "evoTier": 1, "timer": {"pomo": {"phase": "idle", "rounds": 1, "cycle": 4}, "sound": false}}</script><div class="okw-in"><canvas class="okw-scene" width="64" height="40"></canvas><div class="okw-info"></div></div></div></div>
  <div class="external-widget-container" style="grid-area:1/4/span 1/span 1"><div class="okw" role="button" tabindex="0"><script type="application/json" class="okw-data">{"guests": 7, "nextIn": 3, "reviews": 142, "mon": 186, "pet": {"name": "Tama", "tummy": 70, "love": 85, "energy": 70, "stage": 1}, "theme": "#AFC3D6", "evoTier": 1, "timer": {"pomo": {"phase": "idle", "rounds": 1, "cycle": 4}, "sound": false}}</script><div class="okw-in"><canvas class="okw-scene" width="64" height="40"></canvas><div class="okw-info"></div></div></div></div>
  <div class="external-widget-container" style="grid-area:2/1/span 2/span 2"><div class="okw" role="button" tabindex="0"><script type="application/json" class="okw-data">{"guests": 0, "nextIn": 3, "reviews": 142, "mon": 186, "pet": {"name": "Tama", "tummy": 70, "love": 85, "energy": 20, "stage": 1}, "theme": "#AFC3D6", "evoTier": 1, "timer": {"pomo": {"phase": "focus", "endsAt": 0, "remaining": 1101000, "paused": true, "rounds": 1, "cycle": 4}}}</script><div class="okw-in"><canvas class="okw-scene" width="64" height="40"></canvas><div class="okw-info"></div></div></div></div>
  <div class="onigiri-widget-container fake" style="grid-area:2/3/span 2/span 2">Heatmap</div>
</div>
<h3>Plain Anki (no Onigiri), under the deck list</h3>
<div class="plainwrap">[deck list]<div class="okw okw-plain" role="button" tabindex="0"><script type="application/json" class="okw-data">{"guests": 7, "nextIn": 3, "reviews": 142, "mon": 186, "pet": {"name": "Tama", "tummy": 70, "love": 85, "energy": 70, "stage": 1}, "theme": "#AFC3D6", "evoTier": 1, "timer": {"pomo": {"phase": "idle", "rounds": 1, "cycle": 4}, "sound": false}}</script><div class="okw-in"><canvas class="okw-scene" width="64" height="40"></canvas><div class="okw-info"></div></div></div></div>
</body></html>
