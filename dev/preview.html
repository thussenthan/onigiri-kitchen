<!doctype html>
<html><head><meta charset="utf-8"><title>Kitchen preview</title>
<link rel="stylesheet" href="../onigiri_kitchen/web/kitchen.css">
<script src="preview_data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const PD = window.OK_PREVIEW_DATA || {};
const SPECIES_ID = q.has('fresh') ? null : (q.get('species') || 'cat');
const STAGES = [{"days": 0, "jp": "子猫", "name": "Kitten"}, {"days": 3, "jp": "若猫", "name": "Young cat"}, {"days": 10, "jp": "看板猫", "name": "Shop cat"}, {"days": 25, "jp": "招き猫", "name": "Maneki master"}];
const TRAITS = {"classic": {"jp": "三毛", "name": "Classic calico", "desc": "A well-rounded cat with a steady routine."}, "night": {"jp": "夜更かし", "name": "Night owl", "desc": "Studies late with you. Has a little moon on her forehead."}, "scrappy": {"jp": "やんちゃ", "name": "Scrappy", "desc": "Has helped you through a lot of leeches. Bent ear, big heart."}, "chubby": {"jp": "ぽっちゃり", "name": "Well fed", "desc": "Big review days mean lots of scraps. Very round."}};
const GIFTS = [{"id": "momiji", "jp": "紅葉", "name": "Maple leaf", "desc": "Bright red, carried in very carefully."}, {"id": "donguri", "jp": "どんぐり", "name": "Acorn", "desc": "Rolled all the way from the garden."}, {"id": "matsubokkuri", "jp": "松ぼっくり", "name": "Pinecone", "desc": "Slightly chewed."}, {"id": "button", "jp": "ボタン", "name": "Button", "desc": "Nobody knows whose it is."}, {"id": "ribbon", "jp": "リボン", "name": "Ribbon", "desc": "She looked very proud of this one."}, {"id": "hane", "jp": "羽根", "name": "Feather", "desc": "The sparrow's. It's fine, it has others."}, {"id": "biidama", "jp": "ビー玉", "name": "Marble", "desc": "A glass marble with a blue swirl."}, {"id": "kaigara", "jp": "貝殻", "name": "Seashell", "desc": "How did she even find this?"}, {"id": "hanabira", "jp": "花びら", "name": "Petal", "desc": "A sakura petal, a little squished."}, {"id": "orizuru", "jp": "折り鶴", "name": "Paper crane", "desc": "Folded by a guest. Wished for good grades."}, {"id": "kosen", "jp": "古銭", "name": "Old coin", "desc": "A real mon! Added to your purse."}, {"id": "omikuji", "jp": "おみくじ", "name": "Fortune slip", "desc": "A temple fortune. Read it for today's luck."}];
if (q.has('hour')) window.OK_DEBUG_HOUR = parseFloat(q.get('hour'));
if (q.has('ff')) window.OK_DEBUG_FF = parseFloat(q.get('ff'));
window.OK_DEBUG_HOOKS = true;
if (q.has('rain')) window.OK_DEBUG_RAIN = q.get('rain') === '1';
const decks = ['Pharm::Antibiotics','Anatomy::Heart','Biochem','Japanese::N4 Vocab','Micro::Bacteria'];
const guests = [];
for (let i=0;i<parseInt(q.get('guests')||'9');i++) guests.push({deck: decks[i%decks.length], kind: i===2?'leech':(i===0?'golden':'regular'), reviews:10});
const mock = { mon: parseInt(q.get('mon')||'140'), owned: ((q.get('owned')||'bonsai,furin,kakejiku,maneki,daruma,kingyo,sakura,radio,matsuri,tanuki') + (q.has('allgifts') ? ',takaramono' : '') + (q.has('animals') ? ',usagi,kuro,shiba,kitsune,tanuki_friend,tsuru' : '')).split(',').filter(Boolean), hidden: [] };
let phase = q.get('phase') || 'idle';
function pomo(){ const now=Date.now(); const idle=q.has('idle'); return {phase, endsAt: (phase==='idle'||idle)?null: now+ 4*60000, remaining: idle ? 14*60000 : 0, total: 25*60000, paused: idle, idle, rounds: 2, cycle: 4, longBreak: q.has('long'), focusCards: 37, cardGoal:0, now}; }
const stage = parseInt(q.get('stage')||'2');
const SP_STAGES = SPECIES_ID && PD.petSpecies ? PD.petSpecies[SPECIES_ID].stages : STAGES;
const petState = {species: SPECIES_ID, name: q.get('petname')||({cat:'Tama',puffle:'Puff',bird:'Piyo'}[SPECIES_ID]||'Tama'), tummy: parseFloat(q.get('tummy')||'62'), love: 70, energy: parseFloat(q.get('energy')||'70'), stage, stageJp: SP_STAGES[stage].jp, stageName: SP_STAGES[stage].name, studyDays: [1,5,14,30][stage], nextStageDays: stage<3?SP_STAGES[stage+1].days:null, trait: q.get('trait')||'classic', traitInfo: (SPECIES_ID && PD.petSpecies ? PD.petSpecies[SPECIES_ID].traits : TRAITS)[q.get('trait')||'classic'], fish: 4, gifts: q.has('allgifts') ? Object.fromEntries(GIFTS.map(g=>[g.id,1]).concat([['omamori',1]])) : {donguri:2, orizuru:1, kosen:1}, timesPetted: 3, happy: q.has('happy'), petPoints: q.has('unlock') ? 520 : 37, petsToday: 12, fishFed: q.has('unlock') ? 104 : 9, unlocks: q.has('unlock') ? {collar:true,bandana:true,bell:true,fancy_bed:true,kotatsu:true} : {collar:false,bandana:false,bell:false,fancy_bed:false,kotatsu:false}, style: {collar: q.get('collar')||'red', bandana: q.has('bandana'), bell: q.has('bell'), bed: q.get('bed')||'zabuton'}, setBonus: q.has('allgifts')};
if (q.has('happy')) { petState.tummy = 85; petState.love = 92; petState.energy = 80; }
window.OK_INIT = {
  pet: petState, petRareGifts: [{"id": "omamori", "jp": "招き猫お守り", "name": "Lucky cat charm", "desc": "A golden maneki-neko charm. Rare!", "rare": "1"}, {"id": "koban", "jp": "小判", "name": "Gold koban", "desc": "An old gold coin. Worth 25 mon!", "rare": "1"}, {"id": "kanzashi", "jp": "簪", "name": "Kanzashi", "desc": "A delicate hairpin with a tiny sakura. Rare!", "rare": "1"}], petMilestones: {"collar": {"kind": "pets", "need": 50}, "bandana": {"kind": "pets", "need": 200}, "bell": {"kind": "pets", "need": 500}, "fancy_bed": {"kind": "fish", "need": 25}, "kotatsu": {"kind": "fish", "need": 100}}, petsPerDay: 20, petAway: parseInt(q.get('away')||'0'), petStages: SP_STAGES, levelUp: q.has('levelup') ? {from: 19, to: parseInt(q.get('level')||'24')} : null, goalParty: parseInt(q.get('party')||'0'), specials: q.has('nospecials') ? {found:false, book:[], today:null} : PD.specials, petSpecies: PD.petSpecies, puffleColors: PD.puffleColors, birdColors: PD.birdColors, puffleColorPrice: PD.puffleColorPrice, petGifts: GIFTS,
  reason: q.get('reason')||'',
  onigiri: {found:true, name: q.get('name')||'Onigiri Kitchen', level: parseInt(q.get('level')||'24'), xpInto: 1219, xpNext: 2450, themeColor: '#'+(q.get('color')||'D49083')},
  state: {mon: mock.mon, owned: mock.owned, hidden: [], guestsWaiting: guests.length, servedTotal: 0, today:{date:'2026-09-25', reviews:142, focus_done:2}, firstSeen:'2026-09-01', tutorialDone: !q.has('tour'), puffleColor: q.get('puffle') || (SPECIES_ID==='puffle' ? 'blue' : ''), puffleColors: (q.get('puffles') || (SPECIES_ID==='puffle' ? (q.get('puffle')||'blue') : '')).split(',').filter(Boolean), birdColor: q.get('bird') || (SPECIES_ID==='bird' ? 'grey' : ''), birdColors: (q.get('birds') || (SPECIES_ID==='bird' ? (q.get('bird')||'grey') : '')).split(',').filter(Boolean)},
  takeout: q.has('clean') ? {count:0, mon:0} : {count: 2, mon: 4},
  catalog: PD.catalog,
  conf: {"focus_minutes": 25, "short_break_minutes": 5, "long_break_minutes": 15, "rounds_before_long_break": 4, "focus_card_goal": 0, "auto_open_kitchen_on_break": true, "auto_start_next_focus": false, "widget_click_opens_kitchen": true, "show_timer_chip": true, "show_timer_chip_in_reviewer": true, "reviews_per_guest": 10, "sound": true, "volume": 0.5, "shortcut": "Ctrl+Shift+K", "show_home_widget_without_onigiri": true, "celebrate_deck_finish": true, "pause_focus_when_idle": true, "idle_pause_minutes": 1, "clock_style": q.get("clock") || "analog"},
  timer: {pomo: pomo(), sound:true, volume:0.5}
};
window.pycmd = function(msg, cb){
  const [, cmd, ...rest] = msg.split(':'); const arg = rest.join(':');
  let r = null;
  if (cmd==='claim') r = guests.shift() || null;
  else if (cmd==='pay') { mock.mon += JSON.parse(arg).amount; r = {mon: mock.mon, owned: mock.owned, hidden: mock.hidden, guestsWaiting: guests.length, today:{reviews:142, focus_done:2}}; }
  else if (cmd==='timer') { if (arg==='endless') window.__endless=!window.__endless; if (arg==='start') { phase='focus'; window.__endlessStart=Date.now(); } if (arg==='skip') phase = window.__endless && phase==='focus' ? 'idle' : phase==='focus'?'break':'idle'; if (arg==='reset') phase='idle'; const pm=pomo(); if (window.__endless && phase==='focus') Object.assign(pm, {endless:true, endsAt:null, paused:false, elapsed: Date.now()-(window.__endlessStart||Date.now())+ 26*60000, total:25*60000}); r = {pomo: pm, sound:true, endlessMode: !!window.__endless}; }
  else if (cmd==='conf') r = Object.assign(window.OK_INIT.conf, JSON.parse(arg));
  else if (cmd==='pet') { if (arg==='feed') petState.fish--; petState.love=Math.min(100,petState.love+5); r={ok:true,msg:'',pet:petState}; }
  else if (cmd==='petgift') { const gft = q.has('gift') ? Object.assign({}, GIFTS.find(x=>x.id===q.get('gift'))||GIFTS[11]) : null; if (gft && gft.id==='omikuji') gft.fortune={jp:'大吉',text:'Great blessing. Your cards will stick today.'}; r={gift:gft, pet:petState}; }
  else if (cmd==='petstyle') { const o=JSON.parse(arg); petState.style[o.key]=o.value; r=petState; }
  else if (cmd==='petname') { petState.name=arg; r=petState; }
  else if (cmd==='serveall') { const n=guests.length; guests.length=0; mock.mon+=n*3; r={count:n, mon:n*3, kinds:{regular:n}, decks:{a:1,b:1}, state:{mon:mock.mon, guestsWaiting:0}, pet: petState}; }
  else if (cmd==='choose') { const o=JSON.parse(arg); const S0=window.OK_INIT.state; petState.species=o.species; petState.name={cat:'Tama',puffle:'Puff',bird:'Piyo'}[o.species]; const stg=PD.petSpecies[o.species].stages; petState.stageJp=stg[stage].jp; petState.stageName=stg[stage].name; if(o.species==='puffle'){S0.puffleColors=[o.color]; S0.puffleColor=o.color;} if(o.species==='bird'){S0.birdColors=[o.color]; S0.birdColor=o.color;} r={ok:true, pet:petState, stages:stg, state:{puffleColor:S0.puffleColor, puffleColors:S0.puffleColors, birdColor:S0.birdColor, birdColors:S0.birdColors}}; }
  else if (cmd==='petcolor') { const o=JSON.parse(arg); const S0=window.OK_INIT.state; const ok=o.kind+'Colors', ck=o.kind+'Color'; const own=S0[ok]||[]; if(!own.includes(o.color)){ if(own.length){ if(mock.mon<250){cb&&cb({ok:false,msg:'Not enough mon',state:{}});return;} mock.mon-=250;} own.push(o.color);} S0[ok]=own; S0[ck]=o.color; r={ok:true, msg:o.color+'!', state:{mon:mock.mon, [ok]:own.slice(), [ck]:o.color}}; }
  else if (cmd==='pufflecolor') { const S0=window.OK_INIT.state; const own=S0.puffleColors||[]; if(!own.includes(arg)){ if(own.length){ if(mock.mon<250){cb&&cb({ok:false,msg:'Not enough mon',state:{}});return;} mock.mon-=250;} own.push(arg);} S0.puffleColors=own; S0.puffleColor=arg; r={ok:true, msg:arg+' puffle!', state:{mon:mock.mon, puffleColor:arg, puffleColors:own.slice()}}; }
  else if (cmd==='buy') { const it=PD.catalog.find(c=>c.id===arg); if (mock.mon>=it.price){ mock.mon-=it.price; mock.owned.push(arg); r={ok:true,msg:it.name+' added!',state:{mon:mock.mon, owned:mock.owned.slice(), hidden:mock.hidden}}; } else r={ok:false,msg:'Not enough mon',state:{}}; }
  else if (cmd==='toggle') { const h=mock.hidden; const i=h.indexOf(arg); if(i>=0) h.splice(i,1); else h.push(arg); r={mon:mock.mon, owned:mock.owned, hidden:h, guestsWaiting: guests.length}; }
  cb && cb(r);
};
</script></head>
<body class="${q.get('night')?'nightMode':''}">
<div id="mount"></div>
<script>
if (q.get('night')) document.body.className='nightMode';
fetch('../onigiri_kitchen/web/kitchen.html').then(r=>r.text()).then(html=>{
  document.getElementById('mount').outerHTML = html;
  const load = (src)=>new Promise(res=>{const s=document.createElement('script'); s.src=src; s.onload=res; document.body.appendChild(s);});
  load('../onigiri_kitchen/web/sound.js').then(()=>load('../onigiri_kitchen/web/kitchen.js')).then(()=>{ if(q.get('panel')) document.getElementById(q.get('panel')).click(); if(q.get('js')) eval(q.get('js')); });
});
</script>
</body></html>
